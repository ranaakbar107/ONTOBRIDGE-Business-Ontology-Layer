[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ontobridge"
version = "0.1.0"
description = "Business ontology layer: define your business in YAML, build an in-memory knowledge graph and let AI agents query its meaning over MCP."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Rana Akbar" }]
keywords = ["ontology", "knowledge-graph", "mcp", "semantic-layer", "ai-agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "networkx>=3.2",
    "fastmcp>=3.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
ontobridge = "ontobridge.mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ontobridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
